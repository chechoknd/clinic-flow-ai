<div class="min-h-screen bg-slate-50">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
      <a data-testid="app-layout-brand-link" routerLink="/dashboard" class="flex items-center gap-3">
        <span class="grid h-10 w-10 place-items-center rounded-lg bg-teal-600 font-bold text-white">
          CF
        </span>
        <span>
          <span class="block text-sm font-semibold text-slate-950">ClinicFlow AI</span>
          <span class="block text-xs text-slate-500">{{ userLabel() }}</span>
        </span>
      </a>

      <button
        type="button"
        data-testid="app-layout-mobile-menu-button"
        class="inline-flex h-10 items-center justify-center rounded-md border border-slate-300 px-3 text-sm font-medium text-slate-700 sm:hidden"
        (click)="menuOpen.update(toggleOpen)"
      >
        Menu
      </button>

      <nav class="hidden items-center gap-1 sm:flex">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            [attr.data-testid]="'app-layout-nav-link-' + item.label"
            routerLinkActive="bg-slate-900 text-white"
            class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-950"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <button
        type="button"
        data-testid="app-layout-logout-button"
        class="hidden rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 sm:inline-flex"
        (click)="logout()"
      >
        Salir
      </button>
    </div>

    @if (menuOpen()) {
      <nav data-testid="app-layout-mobile-nav" class="border-t border-slate-200 bg-white px-4 py-3 sm:hidden">
        <div class="grid gap-1">
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-slate-900 text-white"
              class="rounded-md px-3 py-2 text-sm font-medium text-slate-700"
              (click)="menuOpen.set(false)"
            >
              {{ item.label }}
            </a>
          }
          <button
            type="button"
            data-testid="app-layout-mobile-logout-button"
            class="rounded-md border border-slate-300 px-3 py-2 text-left text-sm font-medium text-slate-700"
            (click)="logout()"
          >
            Salir
          </button>
        </div>
      </nav>
    }
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6">
    <router-outlet />
  </main>
</div>
