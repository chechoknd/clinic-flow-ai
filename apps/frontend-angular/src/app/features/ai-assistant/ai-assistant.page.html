<section class="grid gap-6 lg:grid-cols-[420px_1fr]">
  <div>
    <h1 class="text-2xl font-semibold text-slate-950">Asistente AI</h1>
    <p class="mt-1 text-sm text-slate-600">Genera respuestas comerciales listas para copiar a WhatsApp.</p>

    <form class="mt-6 grid gap-4 rounded-lg border border-slate-200 bg-white p-5 shadow-sm" [formGroup]="form">
      <label class="grid gap-2 text-sm font-medium text-slate-700">
        Tipo de ayuda
        <select formControlName="mode" class="h-11 rounded-md border border-slate-300 px-3 outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100">
          <option value="reply">Respuesta a pregunta</option>
          <option value="objection">Manejo de objecion</option>
        </select>
      </label>

      <label class="grid gap-2 text-sm font-medium text-slate-700">
        Mensaje del paciente
        <textarea
          formControlName="message"
          rows="7"
          class="rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
          placeholder="Ej: Me interesa el blanqueamiento, pero me parece costoso."
        ></textarea>
        @if (form.controls.message.touched && form.controls.message.invalid) {
          <span class="text-xs text-red-600">Escribe el mensaje o la objecion.</span>
        }
      </label>

      <button
        type="button"
        class="h-11 rounded-md bg-teal-600 px-4 text-sm font-semibold text-white hover:bg-teal-700"
        [disabled]="form.invalid || loading()"
        (click)="generate()"
      >
        {{ loading() ? 'Generando...' : 'Generar respuesta' }}
      </button>
    </form>
  </div>

  <article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="text-base font-semibold text-slate-950">Respuesta sugerida</h2>
        <p class="mt-1 text-sm text-slate-500">Debe ser revisada por el equipo antes de enviarla.</p>
      </div>
      <button
        type="button"
        class="rounded-md border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
        [disabled]="!answer()"
        (click)="copy()"
      >
        Copiar
      </button>
    </div>

    <div class="mt-5 min-h-72 rounded-lg bg-slate-50 p-4 text-sm leading-7 text-slate-700">
      @if (answer()) {
        <p class="whitespace-pre-line">{{ answer() }}</p>
      } @else {
        <p class="text-slate-500">La respuesta generada aparecera aqui.</p>
      }
    </div>

    @if (copied()) {
      <p class="mt-3 text-sm font-medium text-teal-700">Respuesta copiada.</p>
    }
  </article>
</section>
